[project]
name = "semantic-translation-adapter"
version = "0.1.0"
description = "Semantic translation adapter that sends only natural-language units to a translation backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "emoji>=2.14",
    "fastapi>=0.115",
    "lxml>=5",
    "pydantic>=2",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
