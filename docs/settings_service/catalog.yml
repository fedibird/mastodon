open_questions:
- id: notification_emails_followed_param_mismatch
  status: unresolved
  notes: The notifications form submits notification_emails.followed. config/settings.yml
    defaults that key to false. user_settings_params permits followed_message and
    does not permit followed. Strong parameters therefore drop the checkbox. followed_message
    is not a key in the YAML hash or the form. This audit did not rewrite stored values.
- id: notification_emails_duplicate_fields_for_not_executed
  status: unresolved
  notes: The notifications form renders two simple_fields_for :notification_emails
    blocks. Distinct keys should merge in Rack, but this audit did not submit the
    form. Do not treat that merge as executed.
- id: scoped_settings_cache_outside_transaction
  status: unresolved
  notes: ScopedSettings#[]= calls update! and then Rails.cache.write. PreferencesController
    does not wrap the settings write and the user column update in one transaction.
    Hash reads return inside cache.fetch, so nested settings skip the cache write.
    Recorded for P2. Not changed here.
- id: production_stored_values_not_sampled
  status: unresolved
  notes: No production or development database was read. How many users have nil,
    legacy booleans, or unknown translation values is not known. Defaults below describe
    code paths, not row counts.
- id: web_settings_json_schema_open
  status: unresolved
  notes: The WebUI sends PUT /api/web/settings. Rails resource update accepts PATCH
    on the same action. Either method persists params[:data] without a permit list
    or schema. The Redux initialState is a client convention. Saved documents may
    contain keys this catalog does not list.
- id: show_target_has_no_active_ui
  status: unresolved
  notes: show_target is permitted, delegated, defaulted, and copied into InitialState,
    and initial_state.js exports it. No form input and no other JavaScript import
    were found. A dynamic or non-import use would not show up in the import scan.
extractor_limits:
- Haml inputs are detected with a line regex, not a Haml parser. Inputs built outside
  .input :name are invisible, including inputs rendered from a partial or a helper.
- A form input is conditional while an indentation stack still holds a shallower "-
  if" or "- unless" line. The condition is not evaluated. The parser misses a condition
  in another file, a condition that is not written as "- if" or "- unless", and a
  commented parent whose child line is not itself a comment.
- Commented inputs are only those whose own line is a Haml comment. A commented parent
  block with an uncommented child would be counted as active.
- UserSettingsDecorator key lists are read from %w arrays only.
- JavaScript use is counted from static import { name } from an initial_state module.
  Re-exports, require, and string lookups are not followed. Import count zero means
  no such import was found, not that a runtime lookup is impossible.
- Redux meta hydrates the whole InitialState meta object, but preference keys are
  not read back from state.meta by the selectors found in this pass. dynamic_update_possible
  is therefore a structural observation.
- The checker does not boot Rails, connect to PostgreSQL, or connect to Redis.
