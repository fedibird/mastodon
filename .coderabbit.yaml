# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit V2 (the omitted version defaults to V2). Keep review policy review-only:
# a human maintainer authorizes readiness, merge, deployment, and production changes.
language: "ja-JP"

reviews:
  profile: "chill"
  high_level_summary: true
  # Keep human/Cursor-authored PR descriptions intact.
  high_level_summary_in_walkthrough: true
  sequence_diagrams: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  # Never turn a favorable automated review into an automatic approval.
  auto_approvals:
    enabled: false

  # Cursor and maintainers iterate on Draft PRs; CodeRabbit joins when ready.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Continue reviewing subsequent fixes, even beyond the normal pause threshold.
    auto_pause_after_reviewed_commits: 0

  merge_risk_instructions: |
    Treat migrations, locking/backfills on high-volume tables, permission or
    visibility changes, ActivityPub federation/JSON-LD compatibility, private
    data handling, streaming authorization, and cross-account browser state as
    high-risk. Also flag frontend changes that could expose muted content in
    DOM, ALT or accessibility attributes before settings are verified.
    Small documentation/test-only changes are generally lower-risk, but
    correctness and required checks still matter. Do not equate passing unit
    tests with production-scale migration safety or real-device validation.

  # Intentionally no broad path exclusions: dist contains deployment configs,
  # public contains federation vocabulary, and locale/lockfile changes matter.
  path_instructions:
    - path: "app/{controllers,policies,serializers,services}/**"
      instructions: |
        Check authentication, token scopes, owner/target authorization and
        visibility before reads or mutations. Check HTTP status and response
        compatibility on error paths; avoid leaking private/direct content,
        credentials, or another account's settings through caches or logs.
    - path: "app/{lib,services,serializers,workers}/activitypub/**"
      instructions: |
        Check canonical actor/object URIs, signature and authorization
        boundaries, JSON-LD contexts, accepted remote input, and compatibility
        with non-Fedibird servers. A capability advertisement must not imply
        unsupported semantics or accidentally expose posting permissions.
    - path: "app/models/**"
      instructions: |
        Review tenant/user ownership and visibility invariants, validation,
        callbacks and cache invalidation for behavioral changes. Look for
        N+1 or unbounded queries on high-volume associations.
    - path: "app/workers/**"
      instructions: |
        Review idempotency under Sidekiq retry, safe handling of duplicate or
        out-of-order jobs, visibility of delivered data, and bounded work per
        job. Do not assume one delivery or successful execution.
    - path: "db/{migrate,post_migrate}/**"
      instructions: |
        Assume very large production tables. Flag blocking DDL, long-running
        transactions, full-table updates, unsafe index creation, unbounded
        backfills and expensive constraint validation. Request a rollout and
        rollback plan when production safety cannot be shown from the diff.
    - path: "app/javascript/mastodon/**"
      instructions: |
        Check stale async results, account changes, cleanup of listeners and
        timers, and the loading/error/disabled states. For privacy-sensitive
        emoji and translation paths, inspect visible DOM, ALT, title and ARIA,
        not just CSS. Consider mobile/single/multi-column layouts, a11y and
        startup performance; avoid purely aesthetic nitpicks.
    - path: "streaming/**"
      instructions: |
        Check per-user channel authorization, subscription lifecycle,
        reconnect/race handling and payload privacy. Avoid cross-session data
        leaks and changes that unexpectedly amplify event volume.
    - path: "spec/**"
      instructions: |
        Check whether tests would fail on the actual regression, including
        unauthorized requests, missing/false settings, malformed input,
        stale async work and compatibility behavior. Prefer behavior assertions
        over implementation-detail snapshots.
    - path: "config/locales/**"
      instructions: |
        Check interpolation keys and placeholders, language fallback behavior,
        and missing/renamed translation keys; avoid unrelated rewording.
    - path: "docs/settings_service/**"
      instructions: |
        Treat catalog.yml as generated by the scripts in script/. Check that
        behavioral descriptions match the code and explicit false/default
        settings semantics; do not request hand-edits to generated entries.

knowledge_base:
  code_guidelines:
    # CodeRabbit auto-discovers the root AGENTS.md; no duplicate filePatterns.
    enabled: true
