---
:concurrency: 5
:queues:
  - [priority, 12]
  - [default, 8]
  - [push, 6]
  - [ingress, 4]
  - [mailers, 2]
  - [pull]
  - [scheduler]
  - [backup]
  - [maintenance]
  # PostProcessMediaWorker. The default `bundle exec sidekiq` consumes this
  # via the list above. A dedicated media process must be started with
  # `-q ui`. Confirm with Sidekiq::ProcessSet.new that some live process
  # lists "ui"; repository config alone does not prove production does.
  - [ui]
  - [debug]
:scheduler:
  :listened_queues_only: true
  :schedule:
    scheduled_statuses_scheduler:
      every: '5m'
      class: Scheduler::ScheduledStatusesScheduler
      queue: scheduler
    trends_refresh_scheduler:
      every: '5m'
      class: Scheduler::Trends::RefreshScheduler
      queue: scheduler
    trends_review_notifications_scheduler:
      every: '6h'
      class: Scheduler::Trends::ReviewNotificationsScheduler
      queue: scheduler
    media_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(3..5) %> * * *'
      class: Scheduler::MediaCleanupScheduler
      queue: scheduler
    feed_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(0..2) %> * * *'
      class: Scheduler::FeedCleanupScheduler
      queue: scheduler
    follow_recommendations_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(6..9) %> * * *'
      class: Scheduler::FollowRecommendationsScheduler
      queue: scheduler
    doorkeeper_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(0..2) %> * * 0'
      class: Scheduler::DoorkeeperCleanupScheduler
      queue: scheduler
    user_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(4..6) %> * * *'
      class: Scheduler::UserCleanupScheduler
      queue: scheduler
    ip_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(3..5) %> * * *'
      class: Scheduler::IpCleanupScheduler
      queue: scheduler
    email_scheduler:
      cron: '0 10 * * 2'
      class: Scheduler::EmailScheduler
      queue: scheduler
    backup_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(3..5) %> * * *'
      class: Scheduler::BackupCleanupScheduler
      queue: scheduler
    pghero_scheduler:
      cron: '0 0 * * *'
      class: Scheduler::PgheroScheduler
      queue: scheduler
    instance_refresh_scheduler:
      cron: '0 * * * *'
      class: Scheduler::InstanceRefreshScheduler
      queue: scheduler
    accounts_statuses_cleanup_scheduler:
      interval: 1 minute
      class: Scheduler::AccountsStatusesCleanupScheduler
      queue: scheduler
    moderation_ledger_retention_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(3..5) %> * * *'
      class: Scheduler::ModerationLedgerRetentionScheduler
      queue: scheduler
    follow_import_response_timeout_scheduler:
      every: '5m'
      class: Scheduler::FollowImportResponseTimeoutScheduler
      queue: scheduler
    follow_import_completion_scheduler:
      every: '5m'
      class: Scheduler::FollowImportCompletionScheduler
      queue: scheduler
    follow_import_csv_cleanup_scheduler:
      every: '1h'
      class: Scheduler::FollowImportCsvCleanupScheduler
      queue: scheduler
    follow_import_action_review_resume_scheduler:
      every: '5m'
      class: Scheduler::FollowImportActionReviewResumeScheduler
      queue: scheduler
    account_migration_action_review_execution_scheduler:
      every: '5m'
      class: Scheduler::AccountMigrationActionReviewExecutionScheduler
      queue: scheduler
    # Shadow observation backfill only. 10m avoids stacking on the 5m
    # follow-import jobs. Does not change preflight or execution.
    follow_import_review_signal_shadow_scheduler:
      every: '10m'
      class: Scheduler::FollowImportReviewSignalShadowScheduler
      queue: scheduler
    # Provisional / UNCALIBRATED dispatcher cadence (shadow or GLOBAL).
    # Same ENV + default as FollowImport::ExecutionPolicy:
    # FOLLOW_IMPORT_DISPATCH_INTERVAL, with deprecated alias
    # FOLLOW_IMPORT_DISPATCH_SHADOW_INTERVAL when the canonical value
    # is absent. Default 60 seconds. This is NOT
    # FOLLOW_IMPORT_EXECUTION_INTERVAL. Cheap no-op unless
    # FOLLOW_IMPORT_DISPATCH_GLOBAL or FOLLOW_IMPORT_DISPATCH_SHADOW.
    external_bridge_rss_refresh_scheduler:
      every: '15m'
      class: Scheduler::ExternalBridgeRSSRefreshScheduler
      queue: scheduler
    # Recovers asynchronous RSS unsubscribes whose push was refused or whose
    # worker died, and drops completed progress records after 30 days. One pass
    # handles at most 50 jobs. Not gated by the ExternalBridge flags.
    external_bridge_rss_subscription_deletion_scheduler:
      every: '1m'
      class: Scheduler::ExternalBridgeRSSSubscriptionDeletionScheduler
      queue: scheduler
    # Recovers a refused or killed per-subscription display rewrite. One pass
    # queues at most 50 subscriptions. Not gated by the ExternalBridge flags.
    external_bridge_rss_presentation_scheduler:
      every: '1m'
      class: Scheduler::ExternalBridgeRSSPresentationScheduler
      queue: scheduler
    # Releases external media files whose purge or replacement already
    # committed an external_media_gc_intents row, and expired repoint stages.
    # One pass is at most 25 intents. It does not scan unattached uploads
    # and is not flag-gated.
    external_bridge_rss_media_gc_scheduler:
      every: '1m'
      class: Scheduler::ExternalBridgeRSSMediaGcScheduler
      queue: scheduler
    # Conditional GET for ready RSS images older than 24 hours that already
    # have a resource link. At most 10 assets per pass. No-op while the RSS
    # flag is off. URLs are not job args.
    external_bridge_rss_media_revalidate_scheduler:
      every: '15m'
      class: Scheduler::ExternalBridgeRSSMediaRevalidateScheduler
      queue: scheduler
    # Shared feed icons (issue #569): backfill for existing sources and the
    # weekly / backoff re-check. One pass queues at most 20 sources.
    external_bridge_rss_icon_scheduler:
      every: '15m'
      class: Scheduler::ExternalBridgeRSSIconScheduler
      queue: scheduler
    external_bridge_atproto_attempt_cleanup_scheduler:
      every: '10m'
      class: Scheduler::ExternalBridgeAtprotoAttemptCleanupScheduler
      queue: scheduler
    # Recovers reference notes committed with published_at still null.
    # Does not consult the link-sharing flag. One pass is at most 20 rows
    # and does not re-push a job Sidekiq already accepted.
    external_bridge_link_reference_publish_scheduler:
      every: '5m'
      class: Scheduler::ExternalBridgeLinkReferencePublishScheduler
      queue: scheduler
    # Owner share-state events for flips that Ruby never saw (a wrapper deleted
    # with plain SQL) or that Sidekiq refused. One pass handles at most 100
    # rows. Not gated by the E4 flag.
    external_bridge_link_boost_notify_scheduler:
      every: '1m'
      class: Scheduler::ExternalBridgeLinkBoostNotifyScheduler
      queue: scheduler
    follow_import_dispatch_scheduler:
      every: '<%= (canonical = ENV["FOLLOW_IMPORT_DISPATCH_INTERVAL"].to_i; alias_n = ENV["FOLLOW_IMPORT_DISPATCH_SHADOW_INTERVAL"].to_i; n = canonical.positive? ? canonical : alias_n; n.positive? ? n : 60) %>s'
      class: Scheduler::FollowImportDispatchScheduler
      queue: scheduler
