---
:concurrency: 5
:queues:
  - [priority, 12]
  - [default, 8]
  - [push, 6]
  - [ingress, 4]
  - [mailers, 2]
  - [pull]
  - [scheduler]
  - [backup]
  - [maintenance]
  - [ui]
  - [debug]
:scheduler:
  :listened_queues_only: true
  :schedule:
    scheduled_statuses_scheduler:
      every: '5m'
      class: Scheduler::ScheduledStatusesScheduler
      queue: scheduler
    trends_refresh_scheduler:
      every: '5m'
      class: Scheduler::Trends::RefreshScheduler
      queue: scheduler
    media_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(3..5) %> * * *'
      class: Scheduler::MediaCleanupScheduler
      queue: scheduler
    feed_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(0..2) %> * * *'
      class: Scheduler::FeedCleanupScheduler
      queue: scheduler
    follow_recommendations_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(6..9) %> * * *'
      class: Scheduler::FollowRecommendationsScheduler
      queue: scheduler
    doorkeeper_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(0..2) %> * * 0'
      class: Scheduler::DoorkeeperCleanupScheduler
      queue: scheduler
    user_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(4..6) %> * * *'
      class: Scheduler::UserCleanupScheduler
      queue: scheduler
    ip_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(3..5) %> * * *'
      class: Scheduler::IpCleanupScheduler
      queue: scheduler
    email_scheduler:
      cron: '0 10 * * 2'
      class: Scheduler::EmailScheduler
      queue: scheduler
    backup_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(3..5) %> * * *'
      class: Scheduler::BackupCleanupScheduler
      queue: scheduler
    pghero_scheduler:
      cron: '0 0 * * *'
      class: Scheduler::PgheroScheduler
      queue: scheduler
    instance_refresh_scheduler:
      cron: '0 * * * *'
      class: Scheduler::InstanceRefreshScheduler
      queue: scheduler
    accounts_statuses_cleanup_scheduler:
      interval: 1 minute
      class: Scheduler::AccountsStatusesCleanupScheduler
      queue: scheduler
    moderation_ledger_retention_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(3..5) %> * * *'
      class: Scheduler::ModerationLedgerRetentionScheduler
      queue: scheduler
    follow_import_response_timeout_scheduler:
      every: '5m'
      class: Scheduler::FollowImportResponseTimeoutScheduler
      queue: scheduler
    follow_import_completion_scheduler:
      every: '5m'
      class: Scheduler::FollowImportCompletionScheduler
      queue: scheduler
    follow_import_csv_cleanup_scheduler:
      every: '1h'
      class: Scheduler::FollowImportCsvCleanupScheduler
      queue: scheduler
    follow_import_action_review_resume_scheduler:
      every: '5m'
      class: Scheduler::FollowImportActionReviewResumeScheduler
      queue: scheduler
    account_migration_action_review_execution_scheduler:
      every: '5m'
      class: Scheduler::AccountMigrationActionReviewExecutionScheduler
      queue: scheduler
    # Shadow observation backfill only. 10m avoids stacking on the 5m
    # follow-import jobs. Does not change preflight or execution.
    follow_import_review_signal_shadow_scheduler:
      every: '10m'
      class: Scheduler::FollowImportReviewSignalShadowScheduler
      queue: scheduler
    # Provisional / UNCALIBRATED dispatcher cadence (shadow or GLOBAL).
    # Same ENV + default as FollowImport::ExecutionPolicy:
    # FOLLOW_IMPORT_DISPATCH_INTERVAL, with deprecated alias
    # FOLLOW_IMPORT_DISPATCH_SHADOW_INTERVAL when the canonical value
    # is absent. Default 60 seconds. This is NOT
    # FOLLOW_IMPORT_EXECUTION_INTERVAL. Cheap no-op unless
    # FOLLOW_IMPORT_DISPATCH_GLOBAL or FOLLOW_IMPORT_DISPATCH_SHADOW.
    follow_import_dispatch_scheduler:
      every: '<%= (canonical = ENV["FOLLOW_IMPORT_DISPATCH_INTERVAL"].to_i; alias_n = ENV["FOLLOW_IMPORT_DISPATCH_SHADOW_INTERVAL"].to_i; n = canonical.positive? ? canonical : alias_n; n.positive? ? n : 60) %>s'
      class: Scheduler::FollowImportDispatchScheduler
      queue: scheduler
