name: Check settings catalog

on:
  push:
    branches: [fedibird, main]
  pull_request:

jobs:
  catalog:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Check the catalog matches the generator
        run: ruby script/check_settings_service_catalog.rb
      - name: Print generated catalog patch for reconciliation
        if: failure()
        run: |
          ruby script/build_settings_service_catalog.rb
          echo 'GENERATED_CATALOG_PATCH_BASE64_BEGIN'
          git diff --unified=0 -- docs/settings_service/catalog.yml | base64 -w0
          echo
          echo 'GENERATED_CATALOG_PATCH_BASE64_END'
      - name: Check the catalog audit invariants
        run: ruby -Itest spec/script/check_settings_service_catalog_test.rb
